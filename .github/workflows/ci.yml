name: DevOpsApi CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        default: Dev
        options:
          - Dev
          - QA
          - Production

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Application
        run: dotnet build --no-restore --configuration $BUILD_CONFIGURATION

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Unit Tests
        run: dotnet test --configuration $BUILD_CONFIGURATION

  publish:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Generate application version
        id: version
        run: |
          VERSION = "1".0.${GITHUB_RUN_NUMBER}"
          echo "version = $VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated version: - $VERSION"

      - name: Publish Application
        run: >
          dotnet publish
          ./DevOpsApi/DevOpsApi.csproj
          --configuration $BUILD_CONFIGURATION
          --output ./publish

      - name: Upload Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-api
          path: ./publish

  deploy:
    needs: publish
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment || 'Dev' }}

    steps:
      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: devops-api
          path: ./deploy

      - name: List downloaded files
        run: |
          echo "Downloaded application:"
          ls -la ./deploy

      - name: Display environment configuration
        run: |
          echo "Environment:" ${{ inputs.environment || 'Dev' }}
          echo "Deploying application: ${{ vars.AZURE_APP_NAME }}"

      - name: Display GitHub context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"

      - name: Manual deployment information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "This was a manual deployment"
          echo "Selected environment: ${{ inputs.environment }}"

      - name: Production deployment check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'Production' }}
        run: |
          echo "Production deployment selected"
          echo "Environment: ${{ inputs.environment }}"

      - name: Generate deployment information
        id: deployment-info
        run: |
          echo "environment_name=${{ inputs.environment || 'Dev' }}" >> "$GITHUB_OUTPUT"

      - name: Read deployment information
        run: |
          echo "Deployment environment: ${{ steps.deployment-info.outputs.environment_name }}"

      - name: Read deployment information
        run: |
          echo "Deployment version generated under publish: ${{ needs.publish.outputs.version}}"
